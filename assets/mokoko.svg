<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Фан-маскот «мококо» (собственный рисунок, не официальный арт). Замените файлом assets/mokoko.png при желании. -->
  <defs>
    <radialGradient id="body" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fbffe6"/>
      <stop offset=".55" stop-color="#e2f2a8"/>
      <stop offset="1" stop-color="#a9cc62"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6e070"/>
      <stop offset="1" stop-color="#4f9a2e"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="110" rx="30" ry="5" fill="#000" opacity=".25"/>
  <!-- росток -->
  <path d="M60 34 C58 24 60 16 62 10" stroke="#5c9f35" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M61 18 C70 4 88 4 92 12 C84 22 70 24 61 18Z" fill="url(#leaf)"/>
  <path d="M60 22 C50 12 36 14 33 21 C40 28 52 28 60 22Z" fill="url(#leaf)"/>
  <!-- тело -->
  <path d="M60 30 C88 30 104 52 104 76 C104 98 84 108 60 108 C36 108 16 98 16 76 C16 52 32 30 60 30Z" fill="url(#body)" stroke="#86ad45" stroke-width="2"/>
  <!-- лапки -->
  <ellipse cx="44" cy="106" rx="9" ry="5" fill="#cfe58f" stroke="#86ad45" stroke-width="1.5"/>
  <ellipse cx="76" cy="106" rx="9" ry="5" fill="#cfe58f" stroke="#86ad45" stroke-width="1.5"/>
  <!-- глаза -->
  <g class="eyes">
    <ellipse cx="45" cy="70" rx="6" ry="8" fill="#2a2418"/>
    <ellipse cx="75" cy="70" rx="6" ry="8" fill="#2a2418"/>
    <circle cx="47" cy="66" r="2.4" fill="#fff"/>
    <circle cx="77" cy="66" r="2.4" fill="#fff"/>
  </g>
  <!-- щёчки и рот -->
  <ellipse cx="34" cy="82" rx="7" ry="4" fill="#ff9a8a" opacity=".55"/>
  <ellipse cx="86" cy="82" rx="7" ry="4" fill="#ff9a8a" opacity=".55"/>
  <path d="M54 82 Q60 88 66 82" stroke="#2a2418" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
