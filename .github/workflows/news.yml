name: Новости и промокоды lostark.ru

on:
  schedule:
    # GitHub часто пропускает/задерживает расписание, поэтому триггеров несколько:
    # чем их больше, тем меньше шанс, что пропустятся все. Лишние запуски дёшевы —
    # без новых новостей коммита нет.
    - cron: "7,22,37,52 * * * *"   # каждые 15 минут (UTC)
  workflow_dispatch: {}      # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Забрать новости
        run: python scripts/fetch_news.py
      - name: Найти промокоды в новых новостях
        run: python scripts/fetch_promos.py
      - name: Сохранить, если есть изменения
        run: |
          if git diff --quiet -- data/news.json data/promocodes.json && [ -z "$(git ls-files --others --exclude-standard assets/promo assets/news)" ]; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/promocodes.json assets/promo assets/news
          git commit -m "Новости и промокоды: автообновление"
          git push
